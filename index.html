function pad(n){return (n<10?"0":"")+n}
function key(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d)}
function hex(c){return [1,3,5].map(function(i){return parseInt(c.substr(i,2),16)})}
function mix(a,b,t){a=hex(a);b=hex(b);return "#"+[0,1,2].map(function(i){return pad0(Math.round(a[i]+(b[i]-a[i])*t))}).join("")}
function pad0(n){var s=n.toString(16);return s.length<2?"0"+s:s}
function status(f){if(f<=0)return "#FFFFFF";return f<=0.5?mix("#F4A09A","#FBE08A",f/0.5):mix("#FBE08A","#8FD19E",(f-0.5)/0.5)}

(function(){var s=0,n=0;keys.forEach(function(k){var d=DATA.days[k];if(d.p&&k<=DATA.today){var dt=new Date(k+"T00:00:00");if((new Date(DATA.today+"T00:00:00")-dt)/864e5<30){s+=d.p[0]/d.p[1];n++}}});

function el(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function render(){
 document.getElementById("title").textContent=MONTHS[M]+" "+Y;
 var g=document.getElementById("grid");g.innerHTML="";
 var h=el("tr");WEEK.forEach(function(w){h.appendChild(el("th",w))});g.appendChild(h);

  if(tr.children.length==7){g.appendChild(tr);tr=el("tr")}
  var k=key(Y,M,d),row=DATA.days[k],td=el("td");td.appendChild(el("b",d));
  var bg="#F1F3F5";
  if(row&&row.p&&!(k>DATA.today&&row.p[0]==0)){bg=status(row.p[0]/row.p[1]);td.appendChild(el("span",Math.round(100*row.p[0]/row.p[1])+"%","pct"))}
